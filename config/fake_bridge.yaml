orbvi_4p_bridge:
  ros__parameters:
    # Production default is fail-closed. Set runtime_mode:=fake explicitly to
    # enable the synthetic source.
    runtime_mode: unsupported
    camera_count: 4
    frames_per_camera: 300
    emit_interval_us: 33333
    frame_width: 1280
    frame_height: 1088
    frame_stride: 0
    callback_queue_capacity: 8
    subscription_queue_capacity: 8
    publish_queue_depth: 5
    topic_namespace: /orbvi/raw
    frame_id_prefix: orbvi_camera_